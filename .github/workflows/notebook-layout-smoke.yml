name: Notebook layout smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notebook-layout-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright-core
      - name: Find Chrome
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start TODAY
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/today-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/today-vite.log
          exit 1
      - name: Check notebook layout
        run: node .github/scripts/notebook_layout_smoke.mjs
