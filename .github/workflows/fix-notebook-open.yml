name: Fix notebook open mode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-notebook-open.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App
        run: python .github/scripts/fix_notebook_open.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "Fix notebook opening behavior"
          git push
