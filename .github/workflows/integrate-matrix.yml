name: Integrate Eisenhower matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-matrix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TODAY
        run: python .github/scripts/integrate_matrix.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          git diff --cached --quiet || git commit -m "Integrate Eisenhower matrix into TODAY"
          git push
