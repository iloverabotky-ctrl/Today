name: Patch notebook immediate add

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-notebook-immediate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notebook task creation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = "inNotebook, notebookOrder: inNotebook ? nextNotebookOrder(current.tasks) : 0, notebookAt: inNotebook ? Date.now() : null, notebookCompleted: false,"
          new = "inNotebook, notebookOrder: inNotebook ? Math.min(0, ...current.tasks.filter((task) => task.inNotebook && !task.notebookCompleted).map((task) => task.notebookOrder)) - 1 : 0, notebookAt: inNotebook ? now : null, notebookCompleted: false,"
          if old not in text:
              raise SystemExit('Expected createTask line not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show new notebook tasks immediately"
          git push
