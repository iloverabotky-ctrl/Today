name: Patch task single click

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-task-single-click.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_task_single_click.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/task-focus.css
          git diff --cached --quiet && exit 0
          git commit -m "Open notebook tasks on single click"
          git push
