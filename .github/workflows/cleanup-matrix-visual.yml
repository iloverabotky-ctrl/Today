name: Cleanup matrix visual check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-matrix-visual.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary visual files
        run: |
          rm -f .github/workflows/matrix-visual.yml
          rm -f .github/workflows/matrix-encode.yml
          rm -f .github/scripts/matrix_visual.mjs
          rm -f .github/tmp/matrix-current.png
          rm -f .github/tmp/matrix-current.b64
          rm -f .github/workflows/cleanup-matrix-visual.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary matrix visual check files"
          git push
