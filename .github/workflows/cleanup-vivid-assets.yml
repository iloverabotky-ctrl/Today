name: Cleanup vivid visual assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-vivid-assets.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f .github/tmp/vivid-contact.png
          rm -f .github/tmp/vivid-contact.b64
          rm -f .github/workflows/cleanup-vivid-assets.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary vivid visual assets"
          git push
