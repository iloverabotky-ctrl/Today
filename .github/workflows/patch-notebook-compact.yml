name: Patch notebook compact add flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-notebook-compact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {\n        event.preventDefault(); setPage('notebook');\n        window.setTimeout(() => document.querySelector<HTMLInputElement>('#new-notebook-task')?.focus(), 0);\n        return;\n      }\n"
          new = "      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {\n        event.preventDefault(); setPage('notebook');\n        window.setTimeout(() => {\n          const input = document.querySelector<HTMLInputElement>('#new-notebook-task');\n          if (input) input.focus();\n          else document.querySelector<HTMLButtonElement>('#new-notebook-add')?.click();\n        }, 0);\n        return;\n      }\n"
          if old not in s: raise SystemExit('keyboard block not found')
          s = s.replace(old, new, 1)
          old = "  const [newTask, setNewTask] = useState('');\n  const [project, setProject] = useState<ProjectId>('none');\n  const [showCompleted, setShowCompleted] = useState(false);\n"
          new = "  const [newTask, setNewTask] = useState('');\n  const [newTaskOpen, setNewTaskOpen] = useState(false);\n  const [project, setProject] = useState<ProjectId>('none');\n  const [showCompleted, setShowCompleted] = useState(false);\n"
          if old not in s: raise SystemExit('state block not found')
          s = s.replace(old, new, 1)
          old = "    <form className=\"new-task-line v6-new-task\" onSubmit={(event) => { event.preventDefault(); if (!newTask.trim()) return; createTask(newTask, project); setNewTask(''); }}>\n      <span>＋</span><input id=\"new-notebook-task\" value={newTask} onChange={(event) => setNewTask(event.target.value)} placeholder=\"Новая задача...\" /><ProjectPicker value={project} setValue={setProject} /><button>Добавить</button>\n    </form>\n"
          new = "    {newTaskOpen ? <form className=\"new-task-line v6-new-task compact-new-task\" onSubmit={(event) => { event.preventDefault(); if (!newTask.trim()) return; createTask(newTask, project); setNewTask(''); setNewTaskOpen(false); }}>\n      <input id=\"new-notebook-task\" autoFocus value={newTask} onChange={(event) => setNewTask(event.target.value)} onKeyDown={(event) => { if (event.key === 'Escape') { setNewTask(''); setNewTaskOpen(false); } }} placeholder=\"Новая задача...\" /><ProjectPicker value={project} setValue={setProject} /><button type=\"submit\">Добавить</button><button type=\"button\" className=\"new-task-cancel\" onClick={() => { setNewTask(''); setNewTaskOpen(false); }} aria-label=\"Закрыть\">×</button>\n    </form> : <button id=\"new-notebook-add\" type=\"button\" className=\"notebook-add-trigger\" onClick={() => setNewTaskOpen(true)} title=\"Добавить задачу\" aria-label=\"Добавить задачу\">＋</button>}\n"
          if old not in s: raise SystemExit('new task form not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/App.tsx
          git commit -m "Make notebook task creation compact"
          git push
