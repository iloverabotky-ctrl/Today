name: Vivid visual check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vivid-visual-check.yml'
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright-core
      - name: Find Chrome
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start TODAY
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/today-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/today-vite.log
          exit 1
      - run: mkdir -p .github/tmp && node .github/scripts/vivid_visual.mjs
      - name: Build contact sheet
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          import os
          names=['vivid-notebook.png','vivid-board.png','vivid-matrix.png']
          thumbs=[]
          for name in names:
              im=Image.open('.github/tmp/'+name).convert('RGB')
              im.thumbnail((700,430))
              c=Image.new('RGB',(720,470),(8,11,14))
              c.paste(im,((720-im.width)//2,28))
              ImageDraw.Draw(c).text((12,8),name,fill=(220,225,222))
              thumbs.append(c)
          sheet=Image.new('RGB',(1440,940),(8,11,14))
          sheet.paste(thumbs[0],(0,0)); sheet.paste(thumbs[1],(720,0)); sheet.paste(thumbs[2],(0,470))
          sheet.save('.github/tmp/vivid-contact.png')
          PY
          base64 -w0 .github/tmp/vivid-contact.png > .github/tmp/vivid-contact.b64
      - name: Commit visual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/vivid-contact.png .github/tmp/vivid-contact.b64
          git commit -m "Add temporary vivid visual contact sheet"
          git push
