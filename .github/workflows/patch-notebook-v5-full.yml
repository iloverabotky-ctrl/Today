name: Patch notebook v5 full

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-notebook-v5-full.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild notebook components
        run: python .github/scripts/patch_notebook_v5_full.py
      - name: Commit notebook rebuild
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/App.tsx
          git commit -m "Rebuild notebook v5 interaction model"
          git push
