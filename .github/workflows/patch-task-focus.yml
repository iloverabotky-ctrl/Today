name: Patch task focus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-task-focus.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_task_focus.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add task drill-down and stage deletion"
          git push
