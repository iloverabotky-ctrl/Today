name: Polish board wait matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-workspace.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App
        run: python .github/scripts/polish_workspace.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "Polish board deadlines wait and matrix behavior"
          git push
