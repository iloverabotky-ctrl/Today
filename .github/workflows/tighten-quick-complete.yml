name: Tighten notebook quick complete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-quick-complete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quick complete style
        run: python .github/scripts/tighten_quick_complete.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/notebook-v5-full.css
          git diff --cached --quiet || git commit -m "Make notebook quick complete more minimal"
          git push
