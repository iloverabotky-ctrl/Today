name: Cleanup TODAY audit temp files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-today-audit-temp.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf .github/tmp/audit
          rm -f .github/scripts/today_audit_review.mjs
          rm -f .github/workflows/today-audit-review.yml
          rm -f .github/workflows/audit-thumbs.yml
          rm -f .github/workflows/cleanup-today-audit-temp.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary TODAY audit review files"
          git push
