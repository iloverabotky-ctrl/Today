name: TODAY design visual check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/today-design-check.yml'
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright-core
      - name: Find Chrome
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start TODAY
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/today-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/today-vite.log
          exit 1
      - run: mkdir -p .github/tmp && node .github/scripts/today_design_check.mjs
      - name: Build contact sheet
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          import os, glob
          files=sorted(glob.glob('.github/tmp/0*.png'))
          thumbs=[]
          for f in files:
              im=Image.open(f).convert('RGB')
              im.thumbnail((700,430))
              canvas=Image.new('RGB',(720,470),(10,14,17))
              x=(720-im.width)//2; y=28
              canvas.paste(im,(x,y))
              d=ImageDraw.Draw(canvas)
              d.text((12,8),os.path.basename(f),(220,225,222))
              thumbs.append(canvas)
          sheet=Image.new('RGB',(1440,1410),(8,11,14))
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%2)*720,(i//2)*470))
          sheet.save('.github/tmp/today-design-contact.png')
          PY
          base64 -w0 .github/tmp/today-design-contact.png > .github/tmp/today-design-contact.b64
      - name: Commit visual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/today-design-contact.png .github/tmp/today-design-contact.b64
          git commit -m "Add temporary TODAY design contact sheet"
          git push
