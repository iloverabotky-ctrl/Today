name: Matrix visual snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matrix-visual.yml'
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright-core
      - name: Find Chrome
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start TODAY
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/today-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/today-vite.log
          exit 1
      - run: mkdir -p .github/tmp && node .github/scripts/matrix_visual.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/matrix-current.png
          git commit -m "Add temporary matrix visual snapshot"
          git push

