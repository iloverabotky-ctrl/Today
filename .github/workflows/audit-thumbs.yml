name: Create audit thumbs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-thumbs.yml'
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          import glob, os, base64
          os.makedirs('.github/tmp/audit/thumbs', exist_ok=True)
          for f in sorted(glob.glob('.github/tmp/audit/*.png')):
              name=os.path.splitext(os.path.basename(f))[0]
              if name=='contact':
                  continue
              im=Image.open(f).convert('RGB')
              im.thumbnail((680,425))
              out=f'.github/tmp/audit/thumbs/{name}.jpg'
              im.save(out, quality=58, optimize=True)
              with open(out,'rb') as fh:
                  b64=base64.b64encode(fh.read()).decode()
              with open(f'.github/tmp/audit/thumbs/{name}.b64','w') as fh:
                  fh.write(b64)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/audit/thumbs/*.b64
          git commit -m "Add temporary audit thumbnail assets"
          git push
# rerun after audit assets are on main
