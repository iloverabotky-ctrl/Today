name: Apply matrix UX polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-matrix-ux.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/apply_matrix_ux.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "Polish matrix workflow and long box"
          git push
