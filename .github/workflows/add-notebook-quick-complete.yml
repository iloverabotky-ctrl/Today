name: Add notebook quick complete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-notebook-quick-complete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App and styles
        run: python .github/scripts/add_notebook_quick_complete.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/notebook-v5-full.css
          git diff --cached --quiet || git commit -m "Add quick complete control to notebook"
          git push
